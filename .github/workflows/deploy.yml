name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install content pipeline deps
        run: npm ci

      - name: Parse book inventory
        run: npm run content:inventory

      - name: Build content
        run: npm run content:build

      - name: Build search index
        run: node tools/content/build-search-index.mjs

      - name: Build graph
        run: npm run content:graph

      - name: Build learning paths
        run: npm run content:paths

      - name: Install web deps
        run: npm --prefix web ci

      - name: Build web (repo subpath)
        env:
          BASE_URL: /${{ github.event.repository.name }}/
        run: npm --prefix web run build

      - name: SPA fallback for GitHub Pages
        run: cp web/dist/index.html web/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
